<!DOCTYPE html>
<html>
<head>
    <title>Aktiviti Div</title>
    <style>
        /* Menambah gaya ringkas untuk melihat bentuk setiap bahagian */
        #header { background-color: #ff9999; height: 60px; text-align: center; }
        #nav { background-color: #99ff99; height: 40px; text-align: center; }
        #content { background-color: #ffff99; height: 200px; width: 70%; float: left; }
        #sidebar { background-color: #99ffff; height: 200px; width: 30%; float: left; }
        #footer { background-color: #ff99ff; height: 50px; clear: both; text-align: center; }
    </style>
</head>
<body>

    <div id="header">Header Section</div>
    <div id="nav">Navigation Bar</div>
    <div id="content">Main Content Area</div>
    <div id="sidebar">Sidebar Content</div>
    <div id="footer">Footer Section</div>

</body>
</html>
