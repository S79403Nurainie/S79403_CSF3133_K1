<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Grade Calculator</title>
    <!-- Link external CSS file (Part 2 - Step 9) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Grade Calculator</h2>
        
        <!-- Fixed onsubmit to include 'return' so page does not reload -->
        <form name="gradeForm" onsubmit="return checkMark()">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>
            
            <div class="form-group">
                <label for="mark">Mark (0-100):</label>
                <input type="text" id="mark" name="mark">
            </div>
            
            <div class="button-group">
                <button type="submit">Check Grade</button>
                <!-- Added Random Mark button (Part 2 - Step 7) -->
                <button type="button" onclick="generateRandomMark()">Random Mark</button>
            </div>
        </form>

        <!-- Result and timestamp display (Part 2 - Step 8) -->
        <p id="result"></p>
        <p id="checkedTime"></p>

        <!-- Fixed onclick function name casing to showTable() -->
        <button type="button" onclick="showTable()">Show Grade Table</button>
        <div id="tableContainer"></div>
    </div>

    <!-- Fixed script filename from grades.js to grade.js -->
    <script src="grade.js"></script>
</body>
</html>
