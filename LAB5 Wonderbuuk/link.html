<!DOCTYPE html>
<html>
<head>
    <title>Google Fonts Example</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }
        h1 {
            font-weight: 800;
        }
        p {
            font-weight: 300;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>This is styled using Google Fonts.</p>
</body>
</html>
