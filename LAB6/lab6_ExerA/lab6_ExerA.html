<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>
    <!-- Link external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header section with title and instructions -->
        <header>
            <h1>Rock, Paper, Scissors</h1>
            <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
        </header>

        <!-- Player section for name input -->
        <section class="player-section">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="Enter your name"> <!-- Name text input-->
            <button onclick="startGame()">Start Game</button> <!-- Start Game button -->
            <p id="welcomeMsg"></p>
        </section>

        <!-- Game section with choice buttons and image display -->
        <section class="game-section">
            <div class="choice-buttons">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="arena">
                <div class="player-box">
                    <p><strong>You</strong></p>
                    <img id="playerImg" src="rock.png" alt="Player Choice">
                </div>
                <div class="vs-text">VS</div>
                <div class="player-box">
                    <p><strong>Computer</strong></p>
                    <img id="computerImg" src="rock.png" alt="Computer Choice">
                </div>
            </div>
        </section>

        <!-- Result and Scoreboard section -->
        <section class="result-section">
            <p id="result"></p>
            <div class="scoreboard">
                Wins: <span id="wins">0</span> | 
                Losses: <span id="losses">0</span> | 
                Draws: <span id="draws">0</span>
            </div>
        </section>

        <!-- History section with table and summary/reset controls -->
        <section class="history-section">
            <h3>History</h3>
            <table id="history">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                </tbody>
            </table>

            <div class="action-buttons">
                <button onclick="showSummary()">Show Summary</button>
                <button onclick="resetGame()">Reset</button>
            </div>
            <p id="summaryText"></p>
        </section>

        <!-- Footer section with start time and copyright -->
        <footer>
            <p id="startTime"></p>
            <p>&copy; 2026 Computer Science Club</p>
        </footer>
    </div>

    <!-- Link external JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
