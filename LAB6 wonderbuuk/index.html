<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- Header that introduces the quiz -->
        <header>
            <h1>Web Development Quiz</h1>
            <p>Test your HTML, CSS, and JavaScript knowledge before the timer runs out!</p>
        </header>

        <!-- Section to display questions, answer options, and timer -->
        <main>
            <section id="quiz-section">
                <div class="status-bar">
                    <span id="question-progress">Question 1 of 5</span>
                    <span id="timer">Time Left: 15s</span>
                </div>
                <h2 id="question-text">Loading question...</h2>
                <div id="options-container"></div>
            </section>

            <!-- Section to show feedback after each answer -->
            <section id="feedback-section" class="hidden">
                <p id="feedback-text"></p>
            </section>

            <!-- Buttons to submit answers and navigate between questions -->
            <section class="controls">
                <button id="submit-btn" onclick="checkAnswer()">Submit Answer</button>
                <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Question</button>
                <button id="restart-btn" class="hidden" onclick="startQuiz()">Restart Quiz</button>
            </section>
        </main>

        <!-- Footer to display the user's score -->
        <footer>
            <p id="score-display">Current Score: 0</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
